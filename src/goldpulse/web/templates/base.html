<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="robots" content="noindex">
<title>{% block title %}{{ title }}{% endblock %} · GoldPulse</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-screen="{{ screen | default('') }}">
<main class="wrap">
{% block body %}{% endblock %}
</main>
{% if screen %}
<nav class="tabbar" aria-label="Điều hướng">
  <a href="/overview" class="{{ 'on' if screen == 's1' }}" {% if screen == 's1' %}aria-current="page"{% endif %}>Tổng quan</a>
  <a href="/coverage" class="{{ 'on' if screen == 's2' }}" {% if screen == 's2' %}aria-current="page"{% endif %}>Độ phủ</a>
  <a href="/query" class="{{ 'on' if screen == 's3' }}" {% if screen == 's3' %}aria-current="page"{% endif %}>Tra thử</a>
</nav>
<script src="/static/app.js" defer></script>
{% endif %}
</body>
</html>
