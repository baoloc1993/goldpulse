# Instance BTC: cùng image với production vàng, INSTRUMENTS=BTCUSDT, project Docker riêng
# `goldpulse-btc` → Postgres + volume riêng, KHÔNG đụng production vàng (project `goldpulse`, cổng 8080/5432).
# Chạy:  docker compose -f deployment/btc/docker-compose.yml --env-file deployment/btc/.env up -d --build
# Web: http://127.0.0.1:8081 (WEB_BIND=0.0.0.0 để điện thoại cùng LAN vào). Không có brain. Có container backup
# (pg_dump mỗi ngày, giữ 14 bản, vào deployment/btc/backups). Khôi phục: pg_restore từ file dump.
name: goldpulse-btc
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goldpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong deployment/btc/.env}
      POSTGRES_DB: goldpulse_btc
    volumes: ["pgdata_btc:/var/lib/postgresql/data"]
    healthcheck:
      # Qua TCP (-h 127.0.0.1): server tạm lúc khởi tạo volume mới chỉ nhận unix socket, pg_isready qua socket báo "healthy" quá sớm
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U goldpulse -d goldpulse_btc"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ../..
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    build: ../..
    env_file: .env
    ports: ["${WEB_BIND:-127.0.0.1}:8081:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: ../..
    env_file: .env
    command: ["python", "-m", "goldpulse.worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  backup:
    # pg_dump mỗi ngày vào deployment/btc/backups, giữ 14 bản (mất volume = mất cả thí nghiệm 8 tuần,
    # sổ giấy KHÔNG dựng lại được từ nến vì các quyết định bỏ qua/tắt/bật không nằm trong nến)
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          until pg_isready -h db -U goldpulse -d goldpulse_btc -q; do sleep 5; done
          f=/backups/goldpulse-btc-$$(date -u +%Y%m%d-%H%M).dump
          if pg_dump -h db -U goldpulse -d goldpulse_btc -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup ok $$f"
            ls -1t /backups/*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
            sleep 86400
          else
            echo "backup FAILED — thử lại sau 5 phút"
            rm -f "$$f.tmp"
            sleep 300
          fi
        done
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata_btc:
