{% extends "base.html" %}
{% block body %}
<h1>Tra thử theo phiên</h1>
<form id="queryForm" novalidate>
  <div class="field">
    <label for="sess">Phiên</label>
    <select id="sess" name="session">
      <option value="asia">Á (07:00–16:00 giờ VN mùa đông)</option>
      <option value="europe" selected>Âu (14:00–23:00)</option>
      <option value="us">Mỹ (20:00–05:00)</option>
    </select>
  </div>
  <div class="row2">
    <div class="field" id="yearField">
      <label for="y1">Từ năm</label>
      <select id="y1" name="year_from">{% for y in years %}<option{% if loop.first %} selected{% endif %}>{{ y }}</option>{% endfor %}</select>
    </div>
    <div class="field">
      <label for="y2">Đến năm</label>
      <select id="y2" name="year_to">{% for y in years %}<option{% if loop.last %} selected{% endif %}>{{ y }}</option>{% endfor %}</select>
    </div>
  </div>
  <div class="field">
    <label for="dow">Thứ trong tuần</label>
    <select id="dow" name="dow">
      <option value="" selected>Mọi thứ</option>
      <option value="1">Thứ Hai</option><option value="2">Thứ Ba</option><option value="3">Thứ Tư</option>
      <option value="4">Thứ Năm</option><option value="5">Thứ Sáu</option>
    </select>
  </div>
  <div class="err down" id="formErr" role="alert" hidden></div>
  <button class="btn block" type="submit" id="run">Tra</button>
</form>
<h2>Kết quả</h2>
<div id="content" aria-live="polite"><p class="muted">Chọn phiên và khoảng năm rồi bấm Tra.</p></div>
{% endblock %}
