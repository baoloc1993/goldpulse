name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goldpulse
          POSTGRES_PASSWORD: goldpulse
          POSTGRES_DB: goldpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goldpulse -d goldpulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (real PostgreSQL; tests/conftest.py creates goldpulse_test and runs the migrations)
        run: uv run pytest -q
