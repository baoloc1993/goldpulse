# Instance BTC (vòng 4, DECISIONS 2026-10-03): cùng image với production vàng, INSTRUMENTS=BTCUSDT, project Docker riêng
# `goldpulse-btc` → Postgres + volume riêng, KHÔNG đụng production vàng (project `goldpulse`, cổng 8080/5432).
# Chạy:  docker compose -f deployment/btc/docker-compose.yml --env-file deployment/btc/.env up -d --build
# Web: http://127.0.0.1:8081 (WEB_BIND=0.0.0.0 để điện thoại cùng LAN vào). Không có brain, không có backup tự động —
# sổ giấy BTC chạy lại được từ 90 ngày nến Binance; chụp tay: docker compose … exec db pg_dump (DEPLOY.md §4).
name: goldpulse-btc
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goldpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong deployment/btc/.env}
      POSTGRES_DB: goldpulse_btc
    volumes: ["pgdata_btc:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldpulse -d goldpulse_btc"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ../..
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  web:
    build: ../..
    env_file: .env
    ports: ["${WEB_BIND:-127.0.0.1}:8081:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: ../..
    env_file: .env
    command: ["python", "-m", "goldpulse.worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

volumes:
  pgdata_btc:
