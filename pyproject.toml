[project]
name = "goldpulse"
version = "0.1.0"
description = "Kho dữ liệu XAUUSD 1 phút + trang theo dõi"
authors = [
    { name = "baoloc1993@gmail.com", email = "baoloc1993@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.70.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.47",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Công cụ dòng lệnh chạy tay (tua lại lịch sử) — đọc/ghi file JSONL đồng bộ là chủ ý
"src/goldpulse/eval/*" = ["ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
